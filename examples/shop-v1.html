<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Магазин — версия 1</title>
<link rel="stylesheet" href="shop.css">
</head>
<body>
  <header>
    <a href="/" class="logo">Магазин</a>
    <input type="search" placeholder="Поиск товаров">
    <button data-testid="login">Войти</button>
  </header>

  <div class="layout">
    <aside aria-label="Профиль">
      <nav>
        <a href="/cart">Корзина</a>
        <a href="/orders">Заказы</a>
        <a href="/favorites">Избранное</a>
        <a href="/subscriptions">Подписки</a>
      </nav>
    </aside>

    <main>
      <h1>Каталог</h1>
      <button>Фильтры</button>
      <div class="grid">
        <article><h2>Чайник</h2><p>2 990 ₽</p><button>В корзину</button></article>
        <article><h2>Кофемолка</h2><p>4 490 ₽</p><button>В корзину</button></article>
        <article><h2>Тостер</h2><p>3 290 ₽</p><button>В корзину</button></article>
        <article><h2>Блендер</h2><p>5 990 ₽</p><button>В корзину</button></article>
      </div>
      <section class="promo" data-uichanges-ignore>
        <a href="/promo/123">Персональная скидка для вас</a>
      </section>
    </main>
  </div>

  <footer>
    <a href="/help">Помощь</a>
    <a href="/contacts">Контакты</a>
  </footer>
</body>
</html>
